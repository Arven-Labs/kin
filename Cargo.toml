[workspace]
resolver = "3"
members = ["crates/*"]

[profile.dev]
# Só tabelas de linha: backtraces e panics seguem com arquivo:linha, e os artefatos de debug ficam bem menores
# (o target/ chegou a 50 GB com debug info completo e cache incremental).
debug = "line-tables-only"
# Sem cache incremental: ele só acelera quem recompila a mesma árvore e chegou a 16 GB em target/debug/incremental.
incremental = false

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT"
repository = "https://github.com/masterlxz/kin"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[workspace.dependencies]
# Dependências externas entram aqui e são herdadas pelos crates que as usam.
# Previstas: libp2p 0.57 (D3, transport/overlay), openmls 0.9 (D2, crypto).
libp2p-identity = { version = "0.3", features = ["ed25519", "peerid", "rand"] }
thiserror = "2"
# Chave Schnorr (BIP-340) do device para o backend Nostr (ADR 0004). libsecp256k1 em C, versão exata (cripto).
secp256k1 = { version = "=0.30.0", default-features = false, features = ["std", "rand"] }
# Protocolo Nostr (só tipos e cripto, sem rede): NIP-44/59 do gift wrap (ADR 0004). Versão exata (cripto).
nostr = { version = "=0.45.7", default-features = false, features = ["std", "nip59", "os-rng"] }
# Websocket (wss com rustls e raízes embutidas) para falar com os relays Nostr (ADR 0004). Versão exata.
tokio-tungstenite = { version = "=0.30.0", features = ["connect", "rustls-tls-webpki-roots"] }
libp2p ={ version = "0.57", default-features = false, features = ["tokio", "tcp", "noise", "yamux", "mdns", "identify", "macros", "request-response", "relay", "dcutr", "autonat", "quic", "dns"] }
openmls = "=0.9.0"
openmls_rust_crypto = "=0.6.0"
openmls_basic_credential = "=0.6.0"
openmls_traits = "=0.6.0"
openmls_sqlite_storage = "=0.3.0"
rusqlite = "0.37"
serde = "1"
serde_json = "1"
base64 = "0.22"
# Cifra em repouso das chaves (P13, ADR 0012): KDF por senha e AEAD. Versões exatas (cripto); RustCrypto, sem KDF/AEAD próprio.
argon2 = { version = "=0.5.3", default-features = false, features = ["alloc", "zeroize"] }
chacha20poly1305 = { version = "=0.10.1", default-features = false, features = ["alloc"] }
zeroize = "=1.9.1"
# Prompt de senha sem eco no terminal (CLI).
rpassword = "=7.5.4"
qrcode = { version = "0.14", default-features = false }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "io-util", "io-std"] }
futures = "0.3"
rand = "0.9"
tempfile = "3"
kin-identity = { path = "crates/identity" }
kin-transport = { path = "crates/transport" }
kin-overlay = { path = "crates/overlay" }
kin-crypto = { path = "crates/crypto" }
kin-chat = { path = "crates/chat" }
