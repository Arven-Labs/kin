# Laboratório de NAT do Kin (Fase 2). Topologia:
#
#   a (10.1.0.10) -- lana --[routera NAT]-- pub (203.0.113.0/24) --[routerb NAT]-- lanb -- b (10.2.0.10)
#                                              |
#                                            relay (203.0.113.10)
#
# A rede "pública" usa 203.0.113.0/24 (faixa de documentação, nunca roteada de verdade) e não 172.x: o
# filtro de endereços do chat (`dialable`, P32) recusa IP privado de contato, então com 172.x a rediscagem
# nunca discaria o circuito do relay. As LANs (10.x) seguem privadas, como atrás de um NAT de verdade.
# a e b só conseguem sair pelos roteadores, que fazem NAT (cone ou simétrico, via NAT_MODE).
# Use `lab/run.sh`; não suba isto à mão.
name: kinlab

x-kin: &kin
  image: kin-lab
  volumes:
    - ../target/debug/kin:/usr/local/bin/kin:ro
    - ./node.sh:/lab/node.sh:ro
    - ./passphrase:/lab/passphrase:ro
  entrypoint: ["/lab/node.sh"]
  cap_add: [NET_ADMIN]
  stop_grace_period: 1s

x-router: &router
  image: kin-lab
  volumes:
    - ./router.sh:/lab/router.sh:ro
  entrypoint: ["/lab/router.sh"]
  cap_add: [NET_ADMIN]
  sysctls:
    net.ipv4.ip_forward: "1"
  environment:
    NAT_MODE: "${NAT_MODE:-cone}"
  stop_grace_period: 1s

services:
  relay:
    <<: *kin
    environment:
      KIN_ARGS: "--serve-relay --data-dir /data --listen /ip4/0.0.0.0/tcp/4001"
    networks:
      pub: { ipv4_address: 203.0.113.10 }

  # Segundo relay, para o cenário de failover.
  relay2:
    <<: *kin
    environment:
      KIN_ARGS: "--serve-relay --data-dir /data --listen /ip4/0.0.0.0/tcp/4001"
    networks:
      pub: { ipv4_address: 203.0.113.11 }

  routera:
    <<: *router
    environment:
      NAT_MODE: "${NAT_MODE:-cone}"
      LAN_PREFIX: "10.1.0."
      WAN_PREFIX: "203.0.113."
    networks:
      lana: { ipv4_address: 10.1.0.2 }
      pub: { ipv4_address: 203.0.113.2 }

  routerb:
    <<: *router
    environment:
      NAT_MODE: "${NAT_MODE:-cone}"
      LAN_PREFIX: "10.2.0."
      WAN_PREFIX: "203.0.113."
    networks:
      lanb: { ipv4_address: 10.2.0.2 }
      pub: { ipv4_address: 203.0.113.3 }

  a:
    <<: *kin
    environment:
      GATEWAY: "10.1.0.2"
      KIN_ARGS: "${A_ARGS:-}"
    networks:
      lana: { ipv4_address: 10.1.0.10 }

  # Segundo device da identidade de `a` (cenário multi-device): mesma LAN, atrás do mesmo NAT.
  a2:
    <<: *kin
    environment:
      GATEWAY: "10.1.0.2"
      KIN_ARGS: "${A2_ARGS:-}"
    networks:
      lana: { ipv4_address: 10.1.0.11 }

  # Terceiro device (cenário revoke-device): o segundo irmão, revogado depois do a2.
  a3:
    <<: *kin
    environment:
      GATEWAY: "10.1.0.2"
      KIN_ARGS: "${A3_ARGS:-}"
    networks:
      lana: { ipv4_address: 10.1.0.12 }

  b:
    <<: *kin
    environment:
      GATEWAY: "10.2.0.2"
      KIN_ARGS: "${B_ARGS:-}"
    networks:
      lanb: { ipv4_address: 10.2.0.10 }

networks:
  pub:
    ipam: { config: [{ subnet: 203.0.113.0/24 }] }
  lana:
    internal: true
    ipam: { config: [{ subnet: 10.1.0.0/24 }] }
  lanb:
    internal: true
    ipam: { config: [{ subnet: 10.2.0.0/24 }] }
